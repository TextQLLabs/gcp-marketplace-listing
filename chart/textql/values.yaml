# TextQL for GKE (Google Cloud Marketplace chart).
#
# Renders entirely client-side: no lookups, no required server-side hooks,
# no bundled chart dependencies. Scheduling policy and worker pool tuning
# are baked in; see SETUP.md for everything you are expected to bring.
#
# Secrets (global.secretsMode):
#   values          - plain Kubernetes Secrets rendered from the `secrets:`
#                     block. The Marketplace deployer generates the random
#                     ones; CLI installs set them (SETUP.md). Default.
#   externalSecrets - synced from GCP Secret Manager via the External
#                     Secrets Operator, which must already be installed.
#
# Database: in-cluster PostgreSQL by default (postgres.enabled), or bring
# your own via global.db.* with postgres.enabled=false.

global:
  # One version tag shared by every image in a release.
  imageTag: "1.3.21"
  # Images resolve to <registry>/<name>:<imageTag> unless overridden
  # per-image under `images:`. The main app image lives at <registry>
  # itself, per the Marketplace repo layout.
  registry: "us-docker.pkg.dev/textql-public/textql/textql-byoc-byol"
  # Hostname(s) the app is served on; used for routes and CORS.
  hostnames: ["textql.example.com"]
  # Single-hostname override (the Marketplace UI can only collect scalars).
  # Wins over `hostnames` when set.
  hostname: ""
  # "values" or "externalSecrets" (see header).
  secretsMode: "values"
  externalSecrets:
    # Secret Manager entries are named <remoteKeyPrefix>-<suffix>.
    remoteKeyPrefix: "textql"
    gcp:
      # Project that holds the Secret Manager entries. Required in
      # externalSecrets mode.
      projectId: ""
      # Optional Workload-Identity-bound KSA for the SecretStore. Needs
      # clusterLocation and clusterName when set.
      serviceAccountRef: ""
      clusterLocation: ""
      clusterName: ""
  # External PostgreSQL, used only when postgres.enabled=false. TLS is
  # required (sslmode=require).
  db:
    host: ""
    port: "5432"
    name: "textql"
    username: "textql"
    # values mode only; externalSecrets mode reads it from Secret Manager.
    password: ""
  gcs:
    # GCS bucket for object storage (used when minio.enabled=false).
    # Accessed through the S3-interop endpoint with the HMAC key in
    # secrets.gcsHmac*.
    bucket: ""
  auth:
    # From-address for outbound email (invites, shared reports).
    emailSenderAddress: "textql@example.com"
    # Key id of the connector encryption key used for new encryptions.
    connectorEncryptionPrimaryKey: "k1"
    # Single-tenant OIDC SSO. The app installs and runs without it, but
    # nobody can sign in until issuerUrl, clientId, and the client secret
    # are set.
    oidc:
      # "generic", "okta", or "azure_ad".
      providerType: "generic"
      # e.g. https://login.microsoftonline.com/<tenant>/v2.0
      issuerUrl: ""
      clientId: ""
      # Defaults to "openid profile email".
      scopes: ""
  loadBalancer:
    # GCP SSL certificate name for HTTPS at the Gateway. Empty = HTTP only.
    sslCertificate: ""
    # Pre-reserved regional external static IP name. Empty = ephemeral.
    staticIP: ""
  sandboxProxy:
    # Sandbox egress proxy CA certificate, base64-encoded PEM. Public
    # material; the CA key goes in secrets.sandboxProxyCaKey.
    caCert: ""

# Full image-reference overrides (repo:tag or repo@digest). Set by the
# Marketplace deployer; also how you pin digests. Empty = composed from
# global.registry and global.imageTag.
images:
  web: ""
  computeEngine: ""
  pyWorker: ""
  pyWorkerDashboard: ""
  ontology: ""
  textableau: ""
  oathkeeper: ""
  valkey: ""
  kubectl: ""
  postgres: ""
  minio: ""
  tester: ""

web:
  enabled: true
  replicas: 3
  # Public URL the app is served on.
  publicApi: "https://textql.example.com"

oathkeeper:
  enabled: true
  replicas: 3

computeEngine:
  enabled: true
  replicas: 2
  # Sandbox worker pool sizing. The hard minimum is pre-spawned at startup
  # (compute-engine enforces at least 1); pre-spawned workers need shared
  # storage — see `sandbox` below.
  poolSize: "256"
  minWorkersAvailable:
    hard: 10
    soft: 2
  dashboardPoolSize: "16"
  dashboardMinAvailable: "2"

ontology:
  enabled: true
  replicas: 2

tableau:
  enabled: true

valkey:
  enabled: true

postgres:
  enabled: true
  auth:
    database: "textql"
    username: "textql"
    # Required in values mode. Generated by the Marketplace deployer; CLI
    # installs must set it. Fixed once the database volume is initialized.
    password: ""
  storage:
    size: "64Gi"
    # Empty = the cluster's default StorageClass.
    storageClassName: ""

compute:
  # (required) TextQL deployment id, issued with your license (BYOL).
  # compute-engine refuses to start without one; for evaluation any UUID
  # works, paired with a generated key in secrets.deploymentPrivateKey. AI
  # features need the real credentials.
  deploymentId: ""
  # Outbound email over SMTP. Empty host = outbound email disabled.
  smtp:
    host: ""
    port: "587"
    username: ""
    # "starttls", "ssl", or "none".
    encryption: "starttls"
    # "plain", "login", or "cram-md5".
    authType: "plain"
  gke:
    # VPC network for Filestore instances; must be the network the
    # cluster's subnet belongs to. Required when sandbox.filestore.enabled.
    filestoreNetwork: ""

sandbox:
  # Single-node ReadWriteOnce volume for sandbox workers. Good enough to
  # run workers without Filestore; workers all land on one node and do not
  # share files with compute-engine, so treat it as evaluation storage.
  rwoPvc:
    enabled: false
    size: "10Gi"
  # Filestore-backed ReadWriteMany storage, the production option. Needs
  # the Filestore CSI driver and permission to create a StorageClass, so
  # it is off by default (Marketplace installs run namespace-scoped).
  filestore:
    enabled: false

# In-cluster S3-compatible object storage (MinIO), on by default so file
# features work out of the box. Single node on a PVC; for heavy production
# use switch to a GCS bucket (global.gcs.*, minio.enabled=false).
# secrets.gcsHmacAccessKey/gcsHmacSecretKey double as the root credentials.
minio:
  enabled: true
  bucket: "textql"
  storage:
    size: "16Gi"

# GKE Gateway (external load balancer). Enable after install once DNS, the
# static IP, and the certificate exist; until then use port-forward.
gateway:
  enabled: false

# Secret material for values mode. The Marketplace deployer generates the
# random ones; CLI installs must set everything marked (required).
# Generation commands are in SETUP.md.
secrets:
  # (required) Valkey AUTH password.
  valkeyPassword: ""
  # (required) Key for service-to-service calls.
  internalKey: ""
  # (required) Key the sandbox workers authenticate with.
  sandboxAuthKey: ""
  # (required) Connector-credentials encryption material; the chart derives
  # the key map as "k1=<base64(value)>", so any 32-char random string works.
  connectorEncryptionKey: ""
  # Shared secret between compute-engine and the Tableau engine.
  tableauInternalSecret: ""
  # Ed25519 session-JWT key pair, base64 of the raw key bytes (private =
  # 64-byte seed||public, public = 32 bytes). Sign-in does not work until
  # set. See SETUP.md for generation.
  authJwtPrivateKey: ""
  authJwtPublicKey: ""
  authJwtKeyId: "k1"
  # (required) Deployment private key (base64 ed25519), issued by TextQL
  # with the deployment id — or a generated throwaway one for evaluation.
  deploymentPrivateKey: ""
  # Client secret of the OIDC application.
  oidcClientSecret: ""
  # Only used when compute.smtp.host is set.
  smtpPassword: ""
  # Object storage credentials: GCS HMAC key pair, or the MinIO root
  # user/password when minio.enabled. (required when minio.enabled)
  gcsHmacAccessKey: ""
  gcsHmacSecretKey: ""
  # (required) base64-encoded PEM private key of the sandbox proxy CA
  # (pairs with global.sandboxProxy.caCert). compute-engine will not launch
  # sandbox workers without it. The Marketplace deployer generates it.
  sandboxProxyCaKey: ""

# Prefix the runtime-contract names (the compute-engine Deployment,
# sandbox-files-pvc, sandbox-proxy-ca-cert, regcred, and the worker token
# secret) with the release name, so several app instances can share a
# namespace. Requires compute images 1.3.21 or newer, which honor the
# KUBERNETES_* name-override env vars; set false when running older images.
prefixedNames:
  enabled: true

# pre-delete hook that cleans up dynamically created sandbox pods on
# uninstall. CLI installs only — the Marketplace deployer rejects charts
# with non-test helm hooks.
sandboxPodCleaner:
  enabled: false

# One-shot migration Job. Normally unnecessary (compute-engine migrates in
# an init container); kept for running migrations standalone.
migrationJob:
  enabled: false

# Verification tester Pod. Only the Marketplace test overlay enables this.
apptest:
  enabled: false

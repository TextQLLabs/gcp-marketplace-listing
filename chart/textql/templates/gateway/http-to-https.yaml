{{- if and .Values.gateway.enabled .Values.global.loadBalancer.sslCertificate }}
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-http-redirect
  labels:
    {{- include "tql.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
{{- end }}

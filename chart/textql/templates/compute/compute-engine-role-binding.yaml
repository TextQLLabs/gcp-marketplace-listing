{{- if .Values.computeEngine.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-compute-engine
  labels:
    {{- include "tql.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-compute-engine
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-compute-engine
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if .Values.computeEngine.enabled }}
{{/* Fixed name: worker pods list "regcred" in imagePullSecrets. Images pull
     through node identity, so an empty stub keeps kubelet from warning on
     every worker. Replace with real registry credentials if you need them. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tql.pullSecretName" . }}
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{}}'
{{- end }}

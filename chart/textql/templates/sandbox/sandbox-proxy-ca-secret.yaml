{{- if and .Values.computeEngine.enabled .Values.global.sandboxProxy.caCert }}
{{/* Worker pods mount this secret by name (tql.sandboxProxyCaSecretName). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tql.sandboxProxyCaSecretName" . }}
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
data:
  ca-cert.pem: {{ .Values.global.sandboxProxy.caCert }}
{{- end }}

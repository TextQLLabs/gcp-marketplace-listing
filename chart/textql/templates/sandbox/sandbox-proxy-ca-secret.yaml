{{- if and .Values.computeEngine.enabled .Values.global.sandboxProxy.caCert }}
{{/* The name is fixed: sandbox worker pods mount this secret by exactly
     this name (compiled into the image, optional), so it cannot carry the
     release prefix. */}}
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-proxy-ca-cert
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
data:
  ca-cert.pem: {{ .Values.global.sandboxProxy.caCert }}
{{- end }}

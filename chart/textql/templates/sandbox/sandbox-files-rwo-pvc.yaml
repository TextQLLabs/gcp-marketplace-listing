{{- if and .Values.computeEngine.enabled .Values.sandbox.rwoPvc.enabled (not .Values.sandbox.filestore.enabled) }}
{{/* Fixed name: worker pods reference this claim as "sandbox-files-pvc". */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-files-pvc
  labels:
    {{- include "tql.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.sandbox.rwoPvc.size | quote }}
{{- end }}

{{- if .Values.sandbox.filestore.enabled }}
{{/* Fixed name: worker pods reference this claim as "sandbox-files-pvc". */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-files-pvc
  labels:
    {{- include "tql.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "filestore-{{ .Release.Namespace }}"
  resources:
    requests:
      storage: 1Ti
{{- end }}

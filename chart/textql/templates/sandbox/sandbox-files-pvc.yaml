{{- if .Values.sandbox.filestore.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-sandbox-files
  labels:
    {{- include "tql.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "filestore-{{ .Release.Namespace }}"
  resources:
    requests:
      storage: 1Ti
{{- end }}

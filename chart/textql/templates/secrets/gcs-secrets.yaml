{{- if eq (include "tql.secretsMode" .) "externalSecrets" }}
{{- $p := include "tql.externalSecretsPrefix" . }}
{{ include "tql.externalSecretHeader" (dict "name" "gcs-secrets" "root" .) }}
    - secretKey: hmac.accessKey
      remoteRef:
        key: {{ $p }}-gcs-hmac-access-key
    - secretKey: hmac.secretKey
      remoteRef:
        key: {{ $p }}-gcs-hmac-secret-key
{{- end }}

{{- if eq (include "tql.secretsMode" .) "externalSecrets" }}
{{- $p := include "tql.externalSecretsPrefix" . }}
{{ include "tql.externalSecretHeader" (dict "name" "db-secrets" "root" .) }}
    - secretKey: password
      remoteRef:
        key: {{ $p }}-db-password
    - secretKey: database.url
      remoteRef:
        key: {{ $p }}-db-url
{{- end }}

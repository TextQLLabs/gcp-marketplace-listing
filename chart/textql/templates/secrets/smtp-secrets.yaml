{{- if and (eq (include "tql.secretsMode" .) "externalSecrets") .Values.compute.smtp.host }}
{{- $p := include "tql.externalSecretsPrefix" . }}
{{ include "tql.externalSecretHeader" (dict "name" "smtp-secrets" "root" .) }}
    - secretKey: smtp.password
      remoteRef:
        key: {{ $p }}-smtp-password
{{- end }}

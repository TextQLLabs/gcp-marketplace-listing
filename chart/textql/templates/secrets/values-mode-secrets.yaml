{{- if eq (include "tql.secretsMode" .) "values" }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secrets
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "tql.db.password" . | quote }}
  database.url: {{ include "tql.db.url" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth-secrets
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
stringData:
  private.key: {{ $s.authJwtPrivateKey | quote }}
  public.key: {{ $s.authJwtPublicKey | quote }}
  key.id: {{ $s.authJwtKeyId | quote }}
  connector.encryption.keys: "{{ .Values.global.auth.connectorEncryptionPrimaryKey | default "k1" }}={{ required "secrets.connectorEncryptionKey is required in secretsMode=values (any 32-character random string)" $s.connectorEncryptionKey | b64enc }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-service-auth-secrets
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
stringData:
  internal.key: {{ required "secrets.internalKey is required in secretsMode=values" $s.internalKey | quote }}
  sandbox-auth.key: {{ required "secrets.sandboxAuthKey is required in secretsMode=values" $s.sandboxAuthKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-valkey-secrets
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "secrets.valkeyPassword is required in secretsMode=values" $s.valkeyPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-deployment-secrets
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
stringData:
  deployment.private.key: {{ $s.deploymentPrivateKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-oidc-secrets
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
stringData:
  client.secret: {{ $s.oidcClientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-gcs-secrets
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $.Values.minio.enabled }}
  hmac.accessKey: {{ required "secrets.gcsHmacAccessKey is required when minio.enabled (doubles as the MinIO root user)" $s.gcsHmacAccessKey | quote }}
  hmac.secretKey: {{ required "secrets.gcsHmacSecretKey is required when minio.enabled (doubles as the MinIO root password)" $s.gcsHmacSecretKey | quote }}
  {{- else }}
  hmac.accessKey: {{ $s.gcsHmacAccessKey | quote }}
  hmac.secretKey: {{ $s.gcsHmacSecretKey | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-tableau-internal-secret
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ $s.tableauInternalSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-sandbox-proxy-secrets
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.key: {{ $s.sandboxProxyCaKey | quote }}
{{- if .Values.compute.smtp.host }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-smtp-secrets
  labels:
    {{- include "tql.labels" . | nindent 4 }}
type: Opaque
stringData:
  smtp.password: {{ $s.smtpPassword | quote }}
{{- end }}
{{- end }}

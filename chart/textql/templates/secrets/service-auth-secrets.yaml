{{- if eq (include "tql.secretsMode" .) "externalSecrets" }}
{{- $p := include "tql.externalSecretsPrefix" . }}
{{ include "tql.externalSecretHeader" (dict "name" "service-auth-secrets" "root" .) }}
    - secretKey: internal.key
      remoteRef:
        key: {{ $p }}-internal-key
    - secretKey: sandbox-auth.key
      remoteRef:
        key: {{ $p }}-sandbox-auth-key
{{- end }}

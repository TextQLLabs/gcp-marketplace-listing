{{- if eq (include "tql.secretsMode" .) "externalSecrets" }}
{{- $p := include "tql.externalSecretsPrefix" . }}
{{ include "tql.externalSecretHeader" (dict "name" "auth-secrets" "root" .) }}
    - secretKey: private.key
      remoteRef:
        key: {{ $p }}-auth-private-key
    - secretKey: public.key
      remoteRef:
        key: {{ $p }}-auth-public-key
    - secretKey: key.id
      remoteRef:
        key: {{ $p }}-auth-key-id
    - secretKey: connector.encryption.keys
      remoteRef:
        key: {{ $p }}-connector-encryption-keys
{{- end }}

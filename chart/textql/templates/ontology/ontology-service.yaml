{{- if .Values.ontology.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ontology
  labels:
    {{- include "tql.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tql.selectorLabels" (dict "ctx" . "app" "ontology") | nindent 4 }}
  ports:
    - port: 3005
      targetPort: 3005
  type: ClusterIP
{{- end }}

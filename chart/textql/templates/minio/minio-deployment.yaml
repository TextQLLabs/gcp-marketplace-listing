{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    {{- include "tql.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tql.selectorLabels" (dict "ctx" . "app" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tql.selectorLabels" (dict "ctx" . "app" "minio") | nindent 8 }}
        {{- include "tql.scheduling.serviceTierLabel" . | nindent 8 }}
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
      annotations:
        {{- include "tql.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "tql.podRuntime" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      initContainers:
        # a top-level directory in the data path is a bucket in MinIO's
        # filesystem mode
        - name: make-bucket
          image: "{{ include "tql.image" (dict "ctx" . "key" "minio" "name" "minio") }}"
          imagePullPolicy: Always
          command: ["sh", "-c", "mkdir -p /data/{{ .Values.minio.bucket }}"]
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
      containers:
        - name: minio
          image: "{{ include "tql.image" (dict "ctx" . "key" "minio" "name" "minio") }}"
          # Always: node tag caches must never resurrect a previous image
          imagePullPolicy: Always
          args: ["server", "/data", "--address", ":9000"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-gcs-secrets
                  key: hmac.accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-gcs-secrets
                  key: hmac.secretKey
          ports:
            - containerPort: 9000
              name: api
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-minio-data
{{- end }}

# Verification overlay: merged over /data/schema.yaml when the app runs in
# the Marketplace Verification system (mpdev verify). Trims the deployment to
# the minimal healthy footprint and enables the functionality tests: a
# database migration Job against the in-cluster PostgreSQL, and a tester Pod
# that probes the web and oathkeeper health endpoints.
properties:
  computeEngine.enabled:
    type: boolean
    default: false
  ontology.enabled:
    type: boolean
    default: false
  tableau.enabled:
    type: boolean
    default: false
  web.replicas:
    type: integer
    default: 1
  oathkeeper.replicas:
    type: integer
    default: 1
  migrationJob.enabled:
    type: boolean
    default: true
  apptest.enabled:
    type: boolean
    default: true
  images.tester:
    type: string
    default: "$REGISTRY/tester:$TAG"
  # Verification-only session-JWT key pair (Ed25519, base64 of the raw key
  # bytes), so the web deployment's health endpoint (which requires a
  # parseable public key) can go ready in the throwaway verification
  # namespace. NOT a secret and never a default for real installs:
  # /data/schema.yaml leaves both empty and the user guide tells users to
  # generate their own.
  secrets.authJwtPrivateKey:
    type: string
    default: "Mxfw+Yw2fXDuvWl0GOEVo1yJUXe25kOLAohKydLtuPZYGPKXlD/7bl0b8K2eFgwPyOvnX8t9BXLa5PSTozGnDA=="
  secrets.authJwtPublicKey:
    type: string
    default: "WBjyl5Q/+25dG/CtnhYMD8jr51/LfQVy2uT0k6Mxpww="
